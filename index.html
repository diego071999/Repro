<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Reproductor de música local optimizado para iPhone">
  
  <!-- Apple PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sonic">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  
  <title>Sonic — Reproductor Local</title>
  
  <style>
    :root {
      --bg: #0a0a0a;
      --bg-elevated: #141414;
      --bg-card: #1a1a1a;
      --bg-hover: #222222;
      --text: #f5f5f5;
      --text-secondary: #a0a0a0;
      --text-muted: #666666;
      --accent: #7c5cff;
      --accent-hover: #9278ff;
      --accent-soft: rgba(124, 92, 255, 0.15);
      --progress-bg: #2a2a2a;
      --danger: #ff4d6a;
      --success: #3dd68c;
      --radius: 16px;
      --radius-sm: 10px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
    }

    /* ===== A2HS Banner ===== */
    .a2hs-banner {
      display: none;
      position: fixed;
      bottom: calc(20px + var(--safe-bottom));
      left: 16px;
      right: 16px;
      background: linear-gradient(135deg, #1f1a3a, #2a1f4a);
      border: 1px solid rgba(124, 92, 255, 0.3);
      border-radius: 18px;
      padding: 16px 18px;
      z-index: 1000;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      animation: slideUp 0.4s ease;
    }

    .a2hs-banner.show {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .a2hs-banner .icon {
      width: 44px;
      height: 44px;
      background: var(--accent);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 22px;
    }

    .a2hs-banner .content {
      flex: 1;
      min-width: 0;
    }

    .a2hs-banner .content h3 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .a2hs-banner .content p {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.3;
    }

    .a2hs-banner .close {
      width: 32px;
      height: 32px;
      border: none;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
      color: var(--text-secondary);
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes slideUp {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* ===== App Shell ===== */
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      position: relative;
    }

    /* ===== Header ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 12px;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .logo h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .add-btn-wrapper {
      position: relative;
      width: 44px;
      height: 44px;
    }

    .add-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: white;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s;
      box-shadow: 0 4px 16px rgba(124, 92, 255, 0.4);
    }

    .add-btn:active {
      transform: scale(0.92);
      background: var(--accent-hover);
    }

    /* Critical for iOS: invisible file input over the button */
    .file-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 2;
      font-size: 0;
    }

    /* ===== Main Player ===== */
    .player {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 28px 0;
      min-height: 0;
    }

    .artwork {
      width: min(220px, 55vw);
      height: min(220px, 55vw);
      border-radius: 28px;
      background: linear-gradient(145deg, #1e1a2e, #12101a);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 
        0 20px 50px rgba(0,0,0,0.5),
        0 0 0 1px rgba(255,255,255,0.04);
      margin-bottom: 28px;
      transition: transform 0.3s ease;
    }

    .artwork.playing {
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04); }
      50% { transform: scale(1.02); box-shadow: 0 25px 60px rgba(124, 92, 255, 0.25), 0 0 0 1px rgba(124, 92, 255, 0.15); }
    }

    .artwork-icon {
      font-size: 64px;
      opacity: 0.9;
    }

    .track-info {
      text-align: center;
      width: 100%;
      margin-bottom: 24px;
    }

    .track-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .track-meta {
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* Progress */
    .progress-section {
      width: 100%;
      margin-bottom: 20px;
    }

    .progress-bar {
      position: relative;
      height: 6px;
      background: var(--progress-bg);
      border-radius: 3px;
      cursor: pointer;
      touch-action: none;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #a78bfa);
      border-radius: 3px;
      width: 0%;
      position: relative;
      transition: width 0.1s linear;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      right: -7px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .progress-bar:active .progress-fill::after,
    .progress-bar.seeking .progress-fill::after {
      opacity: 1;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 18px;
      width: 100%;
    }

    .ctrl-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .ctrl-btn:active {
      transform: scale(0.9);
      color: var(--accent);
    }

    .ctrl-btn.active {
      color: var(--accent);
    }

    .play-btn {
      width: 68px;
      height: 68px;
      background: var(--accent);
      color: white;
      font-size: 28px;
      box-shadow: 0 8px 24px rgba(124, 92, 255, 0.4);
    }

    .play-btn:active {
      background: var(--accent-hover);
      transform: scale(0.94);
    }

    /* Volume */
    .volume-section {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 280px;
      margin-bottom: 8px;
    }

    .volume-icon {
      font-size: 16px;
      color: var(--text-secondary);
      width: 20px;
      text-align: center;
    }

    .volume-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: var(--progress-bg);
      border-radius: 2px;
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .volume-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }

    /* ===== Playlist ===== */
    .playlist-section {
      flex-shrink: 0;
      background: var(--bg-elevated);
      border-top: 1px solid rgba(255,255,255,0.04);
      border-radius: 24px 24px 0 0;
      max-height: 38%;
      display: flex;
      flex-direction: column;
      min-height: 160px;
    }

    .playlist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px 10px;
      flex-shrink: 0;
    }

    .playlist-header h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .playlist-count {
      font-size: 13px;
      color: var(--text-muted);
      background: var(--bg-card);
      padding: 4px 10px;
      border-radius: 20px;
    }

    .playlist {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 12px 16px;
      overscroll-behavior: contain;
    }

    .playlist::-webkit-scrollbar {
      width: 0;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 2px;
    }

    .playlist-item:active {
      background: var(--bg-hover);
    }

    .playlist-item.active {
      background: var(--accent-soft);
    }

    .playlist-item.active .item-title {
      color: var(--accent);
    }

    .item-num {
      width: 24px;
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .playlist-item.active .item-num {
      color: var(--accent);
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-duration {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .item-playing {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .eq-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
    }

    .eq-bars span {
      width: 3px;
      background: var(--accent);
      border-radius: 1px;
      animation: eq 0.8s ease-in-out infinite;
    }

    .eq-bars span:nth-child(1) { height: 40%; animation-delay: 0s; }
    .eq-bars span:nth-child(2) { height: 80%; animation-delay: 0.2s; }
    .eq-bars span:nth-child(3) { height: 55%; animation-delay: 0.4s; }

    @keyframes eq {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.4); }
    }

    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      text-align: center;
      color: var(--text-muted);
      height: 100%;
    }

    .empty-state .icon {
      font-size: 40px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 14px;
      line-height: 1.5;
    }

    .empty-state .hint {
      margin-top: 8px;
      font-size: 13px;
      color: var(--accent);
    }

    /* Hidden audio */
    audio {
      display: none;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: calc(20px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      z-index: 2000;
      opacity: 0;
      transition: all 0.3s ease;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <!-- A2HS Banner -->
  <div class="a2hs-banner" id="a2hsBanner">
    <div class="icon">📲</div>
    <div class="content">
      <h3>Instalar Sonic</h3>
      <p>Toca <strong>Compartir</strong> → <strong>Añadir a pantalla de inicio</strong></p>
    </div>
    <button class="close" id="a2hsClose" aria-label="Cerrar">×</button>
  </div>

  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">♪</div>
        <h1>Sonic</h1>
      </div>
      <div class="add-btn-wrapper">
        <button class="add-btn" aria-label="Añadir música">+</button>
        <input 
          type="file" 
          class="file-input" 
          id="fileInput" 
          accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac" 
          multiple
        >
      </div>
    </header>

    <!-- Player -->
    <main class="player">
      <div class="artwork" id="artwork">
        <div class="artwork-icon" id="artworkIcon">🎵</div>
      </div>

      <div class="track-info">
        <div class="track-title" id="trackTitle">Sin música</div>
        <div class="track-meta" id="trackMeta">Añade canciones para empezar</div>
      </div>

      <div class="progress-section">
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-row">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="shuffleBtn" aria-label="Aleatorio" title="Modo aleatorio">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
        </button>
        <button class="ctrl-btn" id="prevBtn" aria-label="Anterior">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
          </svg>
        </button>
        <button class="ctrl-btn play-btn" id="playBtn" aria-label="Reproducir">
          <svg id="playIcon" width="30" height="30" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" aria-label="Siguiente">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
        </button>
        <button class="ctrl-btn" id="clearBtn" aria-label="Limpiar lista" title="Limpiar lista">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>

      <div class="volume-section">
        <span class="volume-icon" id="volIcon">🔊</span>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="1">
      </div>
    </main>

    <!-- Playlist -->
    <section class="playlist-section">
      <div class="playlist-header">
        <h2>Cola de reproducción</h2>
        <span class="playlist-count" id="playlistCount">0 canciones</span>
      </div>
      <div class="playlist" id="playlist">
        <div class="empty-state" id="emptyState">
          <div class="icon">🎧</div>
          <p>No hay canciones cargadas</p>
          <p class="hint">Toca + para añadir música desde tu iPhone</p>
        </div>
      </div>
    </section>
  </div>

  <!-- Native Audio -->
  <audio id="audio" playsinline preload="metadata"></audio>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ===== State =====
    const state = {
      tracks: [],
      currentIndex: -1,
      isPlaying: false,
      isShuffle: false,
      shuffleOrder: [],
      objectUrls: []
    };

    // ===== DOM =====
    const audio = document.getElementById('audio');
    const fileInput = document.getElementById('fileInput');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const clearBtn = document.getElementById('clearBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const trackTitle = document.getElementById('trackTitle');
    const trackMeta = document.getElementById('trackMeta');
    const artwork = document.getElementById('artwork');
    const artworkIcon = document.getElementById('artworkIcon');
    const playlistEl = document.getElementById('playlist');
    const emptyState = document.getElementById('emptyState');
    const playlistCount = document.getElementById('playlistCount');
    const volumeSlider = document.getElementById('volumeSlider');
    const volIcon = document.getElementById('volIcon');
    const toast = document.getElementById('toast');
    const a2hsBanner = document.getElementById('a2hsBanner');
    const a2hsClose = document.getElementById('a2hsClose');

    // ===== Utilities =====
    function formatTime(sec) {
      if (!isFinite(sec) || isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function showToast(msg, duration = 2200) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
    }

    function cleanFileName(name) {
      return name
        .replace(/\.[^/.]+$/, '')
        .replace(/[_-]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    // ===== Playlist Rendering =====
    function renderPlaylist() {
      const count = state.tracks.length;
      playlistCount.textContent = count === 1 ? '1 canción' : `${count} canciones`;

      if (count === 0) {
        playlistEl.innerHTML = '';
        playlistEl.appendChild(emptyState);
        emptyState.style.display = 'flex';
        return;
      }

      emptyState.style.display = 'none';
      playlistEl.innerHTML = '';

      state.tracks.forEach((track, i) => {
        const item = document.createElement('div');
        item.className = 'playlist-item' + (i === state.currentIndex ? ' active' : '');
        item.dataset.index = i;

        const isCurrent = i === state.currentIndex && state.isPlaying;
        item.innerHTML = `
          <span class="item-num">${i + 1}</span>
          <div class="item-info">
            <div class="item-title">${track.title}</div>
            <div class="item-duration">${track.durationLabel || '--:--'}</div>
          </div>
          <div class="item-playing">
            ${isCurrent ? '<div class="eq-bars"><span></span><span></span><span></span></div>' : ''}
          </div>
        `;

        item.addEventListener('click', () => {
          if (state.currentIndex === i) {
            togglePlay();
          } else {
            playTrack(i);
          }
        });

        playlistEl.appendChild(item);
      });
    }

    // ===== Player Logic =====
    function loadTrack(index) {
      if (index < 0 || index >= state.tracks.length) return;

      state.currentIndex = index;
      const track = state.tracks[index];

      audio.src = track.url;
      audio.load();

      trackTitle.textContent = track.title;
      trackMeta.textContent = `Pista ${index + 1} de ${state.tracks.length}`;
      artworkIcon.textContent = '🎵';

      progressFill.style.width = '0%';
      currentTimeEl.textContent = '0:00';
      durationEl.textContent = track.durationLabel || '0:00';

      renderPlaylist();
    }

    function playTrack(index) {
      loadTrack(index);
      // Safari requires user gesture for play — this is already inside a click handler
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise
          .then(() => {
            state.isPlaying = true;
            updatePlayUI();
          })
          .catch(err => {
            console.warn('Play failed:', err);
            state.isPlaying = false;
            updatePlayUI();
            showToast('Toca de nuevo para reproducir');
          });
      }
    }

    function togglePlay() {
      if (state.tracks.length === 0) {
        showToast('Añade canciones primero');
        return;
      }

      if (state.currentIndex === -1) {
        playTrack(0);
        return;
      }

      if (audio.paused) {
        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise
            .then(() => {
              state.isPlaying = true;
              updatePlayUI();
            })
            .catch(() => {
              showToast('Toca de nuevo para reproducir');
            });
        }
      } else {
        audio.pause();
        state.isPlaying = false;
        updatePlayUI();
      }
    }

    function updatePlayUI() {
      if (state.isPlaying) {
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        artwork.classList.add('playing');
      } else {
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        artwork.classList.remove('playing');
      }
      renderPlaylist();
    }

    function nextTrack() {
      if (state.tracks.length === 0) return;

      let next;
      if (state.isShuffle) {
        if (state.shuffleOrder.length === 0) buildShuffleOrder();
        const currentShuffleIdx = state.shuffleOrder.indexOf(state.currentIndex);
        const nextShuffleIdx = (currentShuffleIdx + 1) % state.shuffleOrder.length;
        next = state.shuffleOrder[nextShuffleIdx];
      } else {
        next = (state.currentIndex + 1) % state.tracks.length;
      }
      playTrack(next);
    }

    function prevTrack() {
      if (state.tracks.length === 0) return;

      // If more than 3 seconds in, restart current track
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
      }

      let prev;
      if (state.isShuffle) {
        if (state.shuffleOrder.length === 0) buildShuffleOrder();
        const currentShuffleIdx = state.shuffleOrder.indexOf(state.currentIndex);
        const prevShuffleIdx = (currentShuffleIdx - 1 + state.shuffleOrder.length) % state.shuffleOrder.length;
        prev = state.shuffleOrder[prevShuffleIdx];
      } else {
        prev = (state.currentIndex - 1 + state.tracks.length) % state.tracks.length;
      }
      playTrack(prev);
    }

    function buildShuffleOrder() {
      state.shuffleOrder = state.tracks.map((_, i) => i);
      // Fisher-Yates
      for (let i = state.shuffleOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [state.shuffleOrder[i], state.shuffleOrder[j]] = [state.shuffleOrder[j], state.shuffleOrder[i]];
      }
      // Keep current track first if playing
      if (state.currentIndex >= 0) {
        const idx = state.shuffleOrder.indexOf(state.currentIndex);
        if (idx > 0) {
          state.shuffleOrder.splice(idx, 1);
          state.shuffleOrder.unshift(state.currentIndex);
        }
      }
    }

    function toggleShuffle() {
      state.isShuffle = !state.isShuffle;
      shuffleBtn.classList.toggle('active', state.isShuffle);
      if (state.isShuffle) {
        buildShuffleOrder();
        showToast('Modo aleatorio activado');
      } else {
        state.shuffleOrder = [];
        showToast('Modo aleatorio desactivado');
      }
    }

    function clearPlaylist() {
      if (state.tracks.length === 0) return;
      audio.pause();
      audio.src = '';
      state.isPlaying = false;
      state.currentIndex = -1;
      state.tracks.forEach(t => URL.revokeObjectURL(t.url));
      state.tracks = [];
      state.objectUrls = [];
      state.shuffleOrder = [];
      updatePlayUI();
      trackTitle.textContent = 'Sin música';
      trackMeta.textContent = 'Añade canciones para empezar';
      progressFill.style.width = '0%';
      currentTimeEl.textContent = '0:00';
      durationEl.textContent = '0:00';
      renderPlaylist();
      showToast('Lista limpiada');
    }

    // ===== File Loading =====
    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      if (files.length === 0) return;

      const audioFiles = files.filter(f => 
        f.type.startsWith('audio/') || 
        /\.(mp3|m4a|aac|wav|ogg|flac)$/i.test(f.name)
      );

      if (audioFiles.length === 0) {
        showToast('No se encontraron archivos de audio');
        return;
      }

      let added = 0;
      for (const file of audioFiles) {
        const url = URL.createObjectURL(file);
        state.objectUrls.push(url);

        const track = {
          title: cleanFileName(file.name),
          fileName: file.name,
          url,
          duration: 0,
          durationLabel: '--:--'
        };

        // Probe duration
        try {
          const tempAudio = new Audio();
          tempAudio.preload = 'metadata';
          await new Promise((resolve) => {
            tempAudio.onloadedmetadata = () => {
              track.duration = tempAudio.duration;
              track.durationLabel = formatTime(tempAudio.duration);
              resolve();
            };
            tempAudio.onerror = resolve;
            setTimeout(resolve, 2000);
            tempAudio.src = url;
          });
        } catch (_) {}

        state.tracks.push(track);
        added++;
      }

      renderPlaylist();
      showToast(`${added} canción${added > 1 ? 'es' : ''} añadida${added > 1 ? 's' : ''}`);

      // Auto-play first if nothing was playing
      if (state.currentIndex === -1 && state.tracks.length > 0) {
        // Don't autoplay — Safari blocks it. Just load the first track.
        loadTrack(0);
      }

      // Reset input so same files can be selected again
      fileInput.value = '';
    });

    // ===== Progress & Seek =====
    let isSeeking = false;

    audio.addEventListener('timeupdate', () => {
      if (isSeeking || !audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = pct + '%';
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
      if (state.currentIndex >= 0 && state.tracks[state.currentIndex]) {
        state.tracks[state.currentIndex].duration = audio.duration;
        state.tracks[state.currentIndex].durationLabel = formatTime(audio.duration);
        renderPlaylist();
      }
    });

    audio.addEventListener('ended', () => {
      nextTrack();
    });

    audio.addEventListener('play', () => {
      state.isPlaying = true;
      updatePlayUI();
    });

    audio.addEventListener('pause', () => {
      state.isPlaying = false;
      updatePlayUI();
    });

    function seek(clientX) {
      const rect = progressBar.getBoundingClientRect();
      let pct = (clientX - rect.left) / rect.width;
      pct = Math.max(0, Math.min(1, pct));
      progressFill.style.width = (pct * 100) + '%';
      if (audio.duration) {
        audio.currentTime = pct * audio.duration;
        currentTimeEl.textContent = formatTime(audio.currentTime);
      }
    }

    progressBar.addEventListener('touchstart', (e) => {
      isSeeking = true;
      progressBar.classList.add('seeking');
      seek(e.touches[0].clientX);
    }, { passive: true });

    progressBar.addEventListener('touchmove', (e) => {
      if (!isSeeking) return;
      seek(e.touches[0].clientX);
    }, { passive: true });

    progressBar.addEventListener('touchend', () => {
      isSeeking = false;
      progressBar.classList.remove('seeking');
    });

    progressBar.addEventListener('mousedown', (e) => {
      isSeeking = true;
      progressBar.classList.add('seeking');
      seek(e.clientX);

      const onMove = (ev) => seek(ev.clientX);
      const onUp = () => {
        isSeeking = false;
        progressBar.classList.remove('seeking');
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
      };
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    });

    // ===== Volume =====
    volumeSlider.addEventListener('input', () => {
      audio.volume = volumeSlider.value;
      const v = parseFloat(volumeSlider.value);
      if (v === 0) volIcon.textContent = '🔇';
      else if (v < 0.4) volIcon.textContent = '🔈';
      else if (v < 0.7) volIcon.textContent = '🔉';
      else volIcon.textContent = '🔊';
    });

    // ===== Controls =====
    playBtn.addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', prevTrack);
    nextBtn.addEventListener('click', nextTrack);
    shuffleBtn.addEventListener('click', toggleShuffle);
    clearBtn.addEventListener('click', clearPlaylist);

    // ===== A2HS Banner =====
    function isStandalone() {
      return window.navigator.standalone === true || 
             window.matchMedia('(display-mode: standalone)').matches;
    }

    function isIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) || 
             (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    function isSafari() {
      const ua = navigator.userAgent;
      return /Safari/.test(ua) && !/CriOS|FxiOS|OPiOS|EdgiOS/.test(ua);
    }

    if (isIOS() && isSafari() && !isStandalone()) {
      // Show after a short delay, and only if not dismissed recently
      const dismissed = localStorage.getItem('a2hs-dismissed');
      if (!dismissed || Date.now() - parseInt(dismissed, 10) > 7 * 24 * 60 * 60 * 1000) {
        setTimeout(() => a2hsBanner.classList.add('show'), 1500);
      }
    }

    a2hsClose.addEventListener('click', () => {
      a2hsBanner.classList.remove('show');
      localStorage.setItem('a2hs-dismissed', Date.now().toString());
    });

    // ===== Service Worker Registration =====
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered', reg.scope))
          .catch(err => console.warn('SW registration failed', err));
      });
    }

    // Prevent zoom on double-tap
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });

    // Initial render
    renderPlaylist();
  </script>
</body>
</html>
